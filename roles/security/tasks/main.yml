---
- name: Crear usuario administrador con sudo
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Copiar clave SSH pública al usuario administrador
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    state: present
    key: "{{ lookup('file', ssh_pubkey_path) }}"

- name: Configurar restricciones SSH en un archivo de prioridad temprana
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Reiniciar SSH

- name: Consultar configuración SSH efectiva antes de reiniciar
  ansible.builtin.command:
    argv:
      - /usr/sbin/sshd
      - -T
  register: security_ssh_effective_config
  changed_when: false
  when: not ansible_check_mode

- name: Verificar restricciones SSH globales antes de reiniciar
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in security_ssh_effective_config.stdout_lines"
      - "'kbdinteractiveauthentication no' in security_ssh_effective_config.stdout_lines"
      - "'permitrootlogin no' in security_ssh_effective_config.stdout_lines"
    fail_msg: "La configuración SSH efectiva no cumple las restricciones esperadas; no se reiniciará el servicio."
  when: not ansible_check_mode

- name: Instalar UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Política por defecto - denegar entrante
  community.general.ufw:
    default: deny
    direction: incoming

- name: Política por defecto - permitir saliente
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Permitir SSH en el firewall
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Habilitar UFW
  community.general.ufw:
    state: enabled
