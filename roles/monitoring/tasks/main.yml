---
# --- Node Exporter (binario nativo + systemd) ---

- name: Crear usuario de sistema para node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Descargar y extraer node_exporter
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Instalar el binario en /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    remote_src: true
  notify: Reiniciar node_exporter

- name: Crear unidad systemd para node_exporter
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: Reiniciar node_exporter

- name: Habilitar e iniciar node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

# --- Prometheus + Grafana (Docker Compose) ---

- name: Crear directorio de monitoreo
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    mode: '0755'

- name: Copiar configuración de Prometheus
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus.yml"
    mode: '0644'
  notify: Reiniciar stack de monitoreo

- name: Copiar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: '0644'
  notify: Reiniciar stack de monitoreo

- name: Levantar el stack de monitoreo
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present

# --- Firewall: exponer Grafana y Prometheus ---

- name: Permitir acceso a Grafana en el firewall
  community.general.ufw:
    rule: allow
    port: '3000'
    proto: tcp

- name: Permitir acceso a Prometheus en el firewall
  community.general.ufw:
    rule: allow
    port: '9090'
    proto: tcp
