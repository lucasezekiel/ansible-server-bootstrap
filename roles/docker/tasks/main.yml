---
- name: Instalar la dependencia del módulo deb822
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Crear directorio para llaves GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Descargar la clave GPG oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Agregar el repositorio apt de Docker
  ansible.builtin.deb822_repository:
    name: ansible-docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Instalar paquetes de Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Asegurar que el servicio Docker esté activo y habilitado
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Agregar el usuario administrador al grupo docker
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
  when: docker_grant_admin_group | bool
