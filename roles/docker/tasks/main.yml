---
- name: Crear directorio para llaves GPG
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Descargar y convertir la clave GPG oficial de Docker
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Agregar el repositorio apt de Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Instalar paquetes de Docker
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Asegurar que el servicio Docker esté activo y habilitado
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Agregar el usuario administrador al grupo docker
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true
