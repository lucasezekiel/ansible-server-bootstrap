---
name: Ansible checks

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: python -m pip install ansible-core==2.22.0 ansible-lint==26.11.0
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Check playbook syntax
        run: ansible-playbook -i inventory/hosts.yml site.yml --syntax-check
      - name: Run ansible-lint
        run: ansible-lint --offline --nocolor site.yml
