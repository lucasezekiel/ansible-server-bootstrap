admin_user: lucas
ssh_pubkey_path: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"

common_packages:
  - git
  - curl
  - wget
  - htop
  - unzip
  - ca-certificates

timezone: "America/Argentina/Buenos_Aires"

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Docker group membership grants root-equivalent access. Explicit opt-in only.
docker_grant_admin_group: false

# Optional lab stack; enabling it does not make it production-ready.
enable_monitoring: false
node_exporter_version: "1.12.1"
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
monitoring_dir: "/opt/monitoring"
